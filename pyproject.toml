[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "onprem-genai-embedded"
version = "0.1.0"
description = "Reference implementation of an on-premise GenAI platform for embedded software engineering: measured LLM serving and sizing, a requirements-aware code knowledge graph exposed over MCP, and CI-integrated agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["llm", "on-premise", "mcp", "knowledge-graph", "rag", "traceability", "vllm", "llama.cpp", "embedded"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "typer>=0.15",
  "rich>=13.9",
  "httpx>=0.28",
  "numpy>=2.0",
]

[project.optional-dependencies]
knowledge = [
  "tree-sitter>=0.25",
  "tree-sitter-cpp>=0.23",
  "networkx>=3.4",
  "neo4j>=5.28",
  "mcp>=2.3,<3",
]
bench = ["gguf>=0.17", "huggingface_hub>=0.30"]
eval = ["lizard>=1.17", "tree-sitter>=0.25", "tree-sitter-cpp>=0.23"]
agent = [
    "langgraph>=1.2,<2",
]

[project.scripts]
oge = "onprem_genai.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "pyright>=1.1.400",
  "pre-commit>=4.0",
  "jupytext>=1.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/onprem_genai"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["kaggle/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"src/**" = ["PT018"]
"scripts/evalsuite/**" = ["E501"]  # embedded C sources keep their own line lengths
"kaggle/**" = ["E402", "E501", "E741", "PLC0415", "BLE001", "PLW0603", "PLW1510", "SIM105", "SIM115", "T201", "PLR0915"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "jenkins: needs a running Jenkins with the MCP Server plugin (compose profile ci)",
  "neo4j: requires a running Neo4j instance (NEO4J_URI)",
  "fprime: requires the pinned F´ checkout (scripts/fetch_fprime.sh)",
]
