id: ref-telemetry-pack
category: refactor
title: Refactor repetitive telemetry packing
domain: housekeeping telemetry
difficulty: medium
description: |
  Refactor the code for readability and maintainability without changing its behaviour: replace magic numbers with named constants, remove duplication, reduce nesting and cyclomatic complexity (split into small static functions or use tables), never use goto. The public functions of task.h must keep their exact signatures and behaviour; hidden tests check it.
