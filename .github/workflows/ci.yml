name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest -m "not neo4j and not fprime"

  fprime-and-neo4j:
    runs-on: ubuntu-latest
    needs: quality
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-password-123
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password-123 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 15
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Fetch pinned F´
        run: scripts/fetch_fprime.sh
      - name: Integration tests (F´ ingestion, Neo4j store)
        run: uv run pytest -m "neo4j or fprime"

  deploy-smoke:
    # Builds the platform image and proves the stack works on an internal (no-egress) Docker network.
    runs-on: ubuntu-latest
    needs: quality
    env:
      OGE_API_KEY: ci-${{ github.run_id }}
      LLM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install CLI
        run: uv sync --extra bench
      - name: Download small CI models
        env:
          LLM_REPO: unsloth/Qwen3.5-0.8B-GGUF
          LLM_QUANT: Q4_K_M
        run: scripts/download_models.sh
      - name: Build platform image
        run: docker compose -f deploy/compose.yaml build knowledge-mcp
      - name: Air-gapped smoke test (internal network + egress probe)
        run: >-
          docker compose -f deploy/compose.yaml -f deploy/compose.offline.yaml
          --profile cpu --profile smoke up --abort-on-container-exit --exit-code-from smoke
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.offline.yaml --profile cpu --profile smoke logs --tail 200
