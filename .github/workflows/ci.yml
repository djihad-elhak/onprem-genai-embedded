name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest -m "not neo4j and not fprime"

  fprime-and-neo4j:
    runs-on: ubuntu-latest
    needs: quality
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-${{ github.run_id }}-neo4j
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-${{ github.run_id }}-neo4j 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 15
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-${{ github.run_id }}-neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Fetch pinned F´ and prepare its unit-test build
        run: .github/scripts/run-logged.sh scripts/setup_fprime_ut.sh
      - name: Integration tests (F´ ingestion, Neo4j store, test-generation agent end to end)
        run: uv run pytest -m "neo4j or fprime"

  deploy-smoke:
    # Builds the platform image and proves the stack works on an internal (no-egress) Docker network.
    runs-on: ubuntu-latest
    needs: quality
    env:
      OGE_API_KEY: ci-${{ github.run_id }}
      LLM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install CLI
        run: uv sync --extra bench
      - name: Download small CI models
        env:
          LLM_REPO: unsloth/Qwen3.5-0.8B-GGUF
          LLM_QUANT: Q4_K_M
        run: .github/scripts/run-logged.sh scripts/download_models.sh
      - name: Build platform image
        run: .github/scripts/run-logged.sh docker compose -f deploy/compose.yaml build knowledge-mcp
      - name: Air-gapped smoke test (internal network + egress probe)
        run: >-
          docker compose -f deploy/compose.yaml -f deploy/compose.offline.yaml
          --profile cpu --profile smoke up --abort-on-container-exit --exit-code-from smoke
      - name: Logs on failure
        if: failure()
        run: >-
          docker compose -f deploy/compose.yaml -f deploy/compose.offline.yaml --profile cpu --profile smoke
          logs --no-color --tail 200 2>&1 | tee /dev/stderr | .github/scripts/annotate.sh "Smoke stack logs"

  console-image:
    # Builds the console image (C++ toolchain + F´ workspace), then runs the agent inside it from the HTTP API.
    runs-on: ubuntu-latest
    needs: quality
    env:
      OGE_API_KEY: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the console image
        run: .github/scripts/run-logged.sh docker compose -f deploy/compose.yaml --profile console build console
      - name: Start the console and check that agent runs are available
        run: |
          docker compose -f deploy/compose.yaml --profile console up -d --no-deps console
          for i in $(seq 1 60); do s=$(curl -fsS http://127.0.0.1:8770/api/status) && break; sleep 3; done
          echo "$s"
          echo "$s" | python3 -c "import json, sys; s = json.load(sys.stdin);
          sys.exit(0 if s['workspace']['ready'] and s['replay']['requirements'] > 0 else 1)"
      - name: Agent run inside the container (recorded answer; build, tests, commit and mutants live)
        run: |
          id=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"req_ids": ["SVC-COMSTUB-007"], "model_kind": "replay", "mutants": 1}' \
            http://127.0.0.1:8770/api/runs | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 120); do
            st=$(curl -fsS "http://127.0.0.1:8770/api/runs/$id" | python3 -c "import json, sys; r = json.load(sys.stdin);
          print(r['status'], *[x['status'] for x in r['results']])")
            case "$st" in done*|failed*|cancelled*) break;; esac
            sleep 5
          done
          echo "$st"
          test "$st" = "done passed"
      - name: Console logs on failure
        if: failure()
        run: >-
          docker compose -f deploy/compose.yaml --profile console logs --no-color --tail 200 console 2>&1
          | tee /dev/stderr | .github/scripts/annotate.sh "Console logs"

  jenkins-integration:
    # Jenkins LTS + MCP Server plugin (deploy/compose.ci.yaml). The agent writes tests on a branch (scripted
    # model), then triggers the F´ unit-test pipeline over MCP and waits for its verdict.
    runs-on: ubuntu-latest
    needs: quality
    env:
      JENKINS_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}
      JENKINS_AGENT_PASSWORD: ci-agent-${{ github.run_id }}
      OGE_JENKINS_MCP_URL: http://127.0.0.1:8090/mcp-server/mcp
      OGE_JENKINS_USER: oge-agent
      OGE_JENKINS_TOKEN: ci-agent-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Fetch pinned F´ and prepare its unit-test build
        run: .github/scripts/run-logged.sh scripts/setup_fprime_ut.sh
      - name: Build and start Jenkins
        run: .github/scripts/run-logged.sh docker compose -f deploy/compose.ci.yaml up -d --build
      - name: Build the knowledge graph
        run: uv run oge knowledge ingest
      - name: Wait for Jenkins and its MCP endpoint
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8090/mcp-health && exit 0
            sleep 5
          done
          curl -sS -o /dev/null -w "mcp-health: HTTP %{http_code}\n" http://127.0.0.1:8090/mcp-health || true
          docker compose -f deploy/compose.ci.yaml ps || true
          exit 1
      - name: Agent run, then CI verification over MCP
        run: >-
          uv run oge agent run --scripted tests/data/scripted_agent_answers.json
          -r SVC-COMSTUB-003 -r SVC-COMSTUB-006 --branch oge-agent/ci --out artifacts/agent/ci.jsonl
          --ci-url "$OGE_JENKINS_MCP_URL"
      - name: Check the Jenkins verdict (2 new tests on top of the existing ComStub suite)
        run: >-
          .github/scripts/run-logged.sh uv run python -c "import json, sys; ci = json.load(open('artifacts/agent/ci.ci.json'));
          tail = ci.pop('log_tail', ''); print(json.dumps(ci, indent=1)); print(tail);
          sys.exit(0 if ci['result'] == 'SUCCESS' and ci['tests'].get('totalCount', 0) >= 12 else 1)"
      - name: Jenkins MCP contract test
        env:
          OGE_JENKINS_BRANCH: oge-agent/ci
        run: uv run pytest -m jenkins
      - name: Jenkins logs on failure
        if: failure()
        run: >-
          docker compose -f deploy/compose.ci.yaml logs --no-color --tail 1000 2>&1 | tee /dev/stderr
          | grep -E "SEVERE|ERROR|Exception|Caused|Completed initialization|Jenkins is fully up" | grep -v GitSCM
          | .github/scripts/annotate.sh "Jenkins logs (errors)"
